# Local (docker compose) equivalent of the ServiceMonitor + PrometheusRule from the Helm chart
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: shopverse
    honor_labels: true
    static_configs:
      - targets:
          - api-gateway:8080
          - user-service:8080
          - product-service:8080
          - cart-service:8080
          - order-service:8080
          - payment-service:8080
        labels:
          namespace: local
