apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shopverse
  namespace: argocd
  annotations:
    # Created before any Application (the earliest, `argocd`, is wave -40); an app whose project is missing never syncs
    argocd.argoproj.io/sync-wave: "-50"
spec:
  description: ShopVerse e-commerce platform
  sourceRepos:
    - https://github.com/Shaggydesai/MicroService-App.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: shopverse-dev
    - server: https://kubernetes.default.svc
      namespace: shopverse-prod
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
