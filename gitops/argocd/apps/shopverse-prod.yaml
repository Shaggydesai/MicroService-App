apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopverse-prod
  namespace: argocd
  annotations:
    # After the platform (cert-manager, ESO, Prometheus CRDs) - see gitops/argocd/platform
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: shopverse
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: shopverse
  source:
    repoURL: https://github.com/Shaggydesai/MicroService-App.git
    targetRevision: main
    path: helm/shopverse
    helm:
      releaseName: shopverse
      valueFiles:
        - ../../gitops/environments/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shopverse-prod
  # The API server adds `status: {phase: Pending}` to each StatefulSet volumeClaimTemplate;
  # it isn't part of the desired state.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.status
  syncPolicy:
    # Production syncs automatically too, but only changes when a promotion PR is merged.
    automated:
      prune: true
      selfHeal: true
    # Namespace is created and labelled from Git: every pod must meet the "restricted" Pod Security Standard
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
