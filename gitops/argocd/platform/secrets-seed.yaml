# Generates the initial random secrets and seeds them into Vault (once). See the manifest for details.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-seed
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    app.kubernetes.io/part-of: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/Shaggydesai/MicroService-App.git
    targetRevision: main
    path: gitops/platform/manifests/secrets-seed
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
