# Bank-Vaults operator: runs Vault from a declarative Vault CR (init, unseal, config - no manual steps)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-24"
  labels:
    app.kubernetes.io/part-of: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/bank-vaults/helm-charts
      chart: vault-operator
      targetRevision: 1.24.1
      helm:
        releaseName: vault-operator
        valueFiles:
          - $values/gitops/platform/values/vault-operator.yaml
    - repoURL: https://github.com/Shaggydesai/MicroService-App.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
