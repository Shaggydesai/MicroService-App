# Pool and advertisement live in gitops/platform/manifests/metallb
controller:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
speaker:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
prometheus:
  serviceMonitor:
    enabled: true
  # Prometheus (kube-prometheus-stack) identity, granted access to MetalLB's protected metrics endpoint
  serviceAccount: kube-prometheus-stack-prometheus
  namespace: monitoring
