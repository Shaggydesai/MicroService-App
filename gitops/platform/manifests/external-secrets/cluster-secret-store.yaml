# Lets ExternalSecrets (read) and PushSecrets (seed) in any namespace use Vault's KV v2 engine at "secret/".
# ESO logs in with its own ServiceAccount token via Vault Kubernetes auth (role + policy are declared
# in gitops/platform/manifests/vault/vault.yaml).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences: [vault]
