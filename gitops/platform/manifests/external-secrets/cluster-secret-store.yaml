# Lets ExternalSecrets in any namespace read from Vault's KV v2 engine mounted at "secret/".
# ESO authenticates with its own ServiceAccount token (Vault Kubernetes auth, role "external-secrets"),
# configured by scripts/vault-bootstrap.sh.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
