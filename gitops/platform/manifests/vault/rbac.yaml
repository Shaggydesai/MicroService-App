# Identity of the Vault pods and the Bank-Vaults configurer. On GKE it maps to the Google service
# account that may use the unseal KMS key and bucket (binding in infra/terraform/envs/lab/cluster).
# The Role below lets Vault manage Secrets in this namespace (used by the kubernetes unseal alternative
# in vault.yaml) and label its own pods; only Vault and cluster admins can read Secrets here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
  annotations:
    iam.gke.io/gcp-service-account: vault-unseal@shopverse-lab.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault
  namespace: vault
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
---
# Vault's Kubernetes auth method validates callers' tokens with the TokenReview API
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
