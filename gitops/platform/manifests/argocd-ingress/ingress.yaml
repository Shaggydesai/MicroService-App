# Argo CD UI. Kept out of gitops/bootstrap: an Ingress only turns Healthy once ingress-nginx gives it an
# address, and the self-managed `argocd` app (wave -40) must be Healthy before ingress-nginx (wave -25) is installed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [argocd.8-234-83-188.sslip.io]
      secretName: argocd-server-tls
  rules:
    - host: argocd.8-234-83-188.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
