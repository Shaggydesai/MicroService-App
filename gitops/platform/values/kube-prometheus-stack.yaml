# CRDs come from the prometheus-operator-crds Application (earlier sync wave)
crds:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors / PodMonitors / rules from every namespace, without label requirements
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: 18GB
    resources:
      requests: { cpu: 200m, memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts: [prometheus.8-234-83-188.sslip.io]
    tls:
      - secretName: prometheus-tls
        hosts: [prometheus.8-234-83-188.sslip.io]

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
  # Add your receivers (Slack, PagerDuty, email) here
  config:
    route:
      group_by: [alertname, namespace, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
      routes:
        - matchers: [alertname = "Watchdog"]
          receiver: "null"
    receivers:
      - name: "null"

grafana:
  # Admin credentials come from Vault through the ExternalSecret in gitops/platform/manifests/monitoring
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 2Gi
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts: [grafana.8-234-83-188.sslip.io]
    tls:
      - secretName: grafana-tls
        hosts: [grafana.8-234-83-188.sslip.io]
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        maxLines: 1000
    - name: Pyroscope
      uid: pyroscope
      type: grafana-pyroscope-datasource
      access: proxy
      url: http://pyroscope.monitoring.svc.cluster.local:4040
  grafana.ini:
    server:
      root_url: https://grafana.8-234-83-188.sslip.io
    analytics:
      check_for_updates: false
