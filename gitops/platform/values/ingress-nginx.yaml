controller:
  replicaCount: 2
  service:
    type: LoadBalancer
    # The regional static IP reserved by Terraform (infra/terraform/envs/lab/persistent, output ingress_ip).
    # GKE attaches it to the load balancer, so the sslip.io hostnames never change between cluster rebuilds.
    # Bare metal instead: remove this line and see gitops/optional/bare-metal/README.md.
    loadBalancerIP: 8.234.83.188
    externalTrafficPolicy: Local
  config:
    # JSON access logs -> easy to query in Loki
    log-format-escape-json: "true"
    log-format-upstream: '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$req_id","method":"$request_method","host":"$host","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream":"$proxy_upstream_name","upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}'
    use-forwarded-headers: "true"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: { cpu: 100m, memory: 128Mi }
