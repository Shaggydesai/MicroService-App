installCRDs: true
serviceMonitor:
  enabled: true
  # The ServiceMonitor CRD is installed earlier (prometheus-operator-crds, wave -30)
  renderMode: alwaysRender
resources:
  requests: { cpu: 25m, memory: 64Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
