# Argo CD itself, declared in Git.
#   First install (the only imperative step): scripts/argocd-bootstrap.sh, run by Terraform
#   (infra/terraform/envs/lab/cluster/argocd-bootstrap.tf) or by hand with `make argocd-bootstrap`.
#   After that the `argocd` Application (gitops/argocd/platform/argocd.yaml) manages this directory,
#   so upgrading Argo CD = changing the version below and merging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml
  - repositories.yaml
patches:
  - path: argocd-cm.yaml
  - path: argocd-cmd-params-cm.yaml
