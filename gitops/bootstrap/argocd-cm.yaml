apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: https://argocd.shopverse.local
  # Track resources by annotation (avoids clashes with Helm's app.kubernetes.io/instance label)
  application.resourceTrackingMethod: annotation
  # Make the app-of-apps wait for each Application to be Healthy before the next sync wave,
  # so the platform (CRDs, cert-manager, Vault, ESO) is ready before the workloads that need it.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs
  # Bank-Vaults Vault CR: Healthy once a leader is elected (i.e. initialised + unsealed)
  resource.customizations.health.vault.banzaicloud.com_Vault: |
    hs = {}
    if obj.status ~= nil and obj.status.leader ~= nil and obj.status.leader ~= "" then
      hs.status = "Healthy"
      hs.message = "Leader: " .. obj.status.leader
    else
      hs.status = "Progressing"
      hs.message = "Waiting for Vault to be initialised and unsealed"
    end
    return hs
