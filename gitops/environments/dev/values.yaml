# Dev environment. `global.imageTag` is bumped automatically by CI on every push to main.
global:
  imageRegistry: ghcr.io/shaggydesai/microservice-app
  imageTag: latest

# Secrets come from Vault (secret/shopverse/dev) via External Secrets Operator.
# Seed them once with scripts/vault-bootstrap.sh.
externalSecret:
  enabled: true
  remoteKey: shopverse/dev
secrets:
  create: false

ingress:
  enabled: true
  className: nginx
  host: shop-dev.shopverse.local
  annotations:
    cert-manager.io/cluster-issuer: shopverse-ca-issuer
  tls:
    enabled: true
    secretName: shopverse-dev-tls

monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  dashboards:
    enabled: true

profiling:
  enabled: true

mongodb:
  persistence:
    size: 2Gi
