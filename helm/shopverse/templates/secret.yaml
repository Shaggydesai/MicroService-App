{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.externalSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shopverse.secretName" . }}
  labels:
    {{- include "shopverse.labels" (dict "root" . "name" "secrets") | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  internal-token: {{ .Values.secrets.internalToken | quote }}
  admin-email: {{ .Values.secrets.adminEmail | quote }}
  admin-password: {{ .Values.secrets.adminPassword | quote }}
  mongo-username: {{ .Values.secrets.mongoUsername | quote }}
  mongo-password: {{ .Values.secrets.mongoPassword | quote }}
{{- end }}
