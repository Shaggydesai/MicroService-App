{{- $root := . -}}
{{- range $name, $raw := .Values.services }}
{{- if $raw.enabled }}
{{- $svc := include "shopverse.serviceConfig" (dict "root" $root "cfg" $raw) | fromYaml }}
{{- $ctx := dict "root" $root "name" $name }}
{{- if $svc.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "shopverse.componentName" $ctx }}
  labels:
    {{- include "shopverse.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "shopverse.componentName" $ctx }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if $svc.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "shopverse.componentName" $ctx }}
  labels:
    {{- include "shopverse.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ $svc.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "shopverse.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
