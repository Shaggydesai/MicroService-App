{{- if .Values.externalSecret.enabled }}
# Synced by External Secrets Operator from Vault (KV v2) into a regular Secret.
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "shopverse.secretName" . }}
  labels:
    {{- include "shopverse.labels" (dict "root" . "name" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "shopverse.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $key := list "jwt-secret" "internal-token" "admin-email" "admin-password" "mongo-username" "mongo-password" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey }}
        property: {{ $key }}
    {{- end }}
{{- end }}
