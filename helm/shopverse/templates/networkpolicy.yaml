{{- if .Values.networkPolicy.enabled }}
{{- $ctx := dict "root" . "name" "network-policy" }}
# Public edge: frontend + api-gateway accept traffic from the ingress controller and from the frontend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-edge
  labels:
    {{- include "shopverse.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
      - { key: app.kubernetes.io/name, operator: In, values: [frontend, api-gateway] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if .Values.monitoring.serviceMonitor.enabled }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.monitoring.namespaceSelector | nindent 14 }}
        {{- end }}
      ports:
        - port: 8080
---
# Backend services are only reachable from pods of this release (and Prometheus, when enabled).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "shopverse.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
      - { key: app.kubernetes.io/name, operator: In, values: [user-service, product-service, cart-service, order-service, payment-service] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if .Values.monitoring.serviceMonitor.enabled }}
        # Prometheus scrapes /metrics
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.monitoring.namespaceSelector | nindent 14 }}
        {{- end }}
      ports:
        - port: 8080
{{- if .Values.mongodb.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-mongodb
  labels:
    {{- include "shopverse.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shopverse.selectorLabels" (dict "root" . "name" "mongodb") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name }}] }
              - { key: app.kubernetes.io/name, operator: In, values: [user-service, product-service, cart-service, order-service, payment-service] }
      ports:
        - port: 27017
{{- end }}
{{- end }}
