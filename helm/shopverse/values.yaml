# Default values for ShopVerse. Environment overrides live in gitops/environments/<env>/values.yaml.

global:
  # Images resolve to <imageRegistry>/<service.image>:<service.tag | global.imageTag>
  imageRegistry: ghcr.io/shaggydesai/microservice-app
  imageTag: latest
  imagePullPolicy: IfNotPresent
  # e.g. [{ name: ghcr-pull }] when the GHCR packages are private
  imagePullSecrets: []

# Application secrets. For real environments set create=false and point existingSecret at a
# Secret managed by Sealed Secrets / External Secrets / SOPS with the same keys:
#   jwt-secret, internal-token, admin-email, admin-password, mongo-username, mongo-password
secrets:
  create: true
  existingSecret: ""
  jwtSecret: change-me-jwt-secret
  internalToken: change-me-internal-token
  adminEmail: admin@shopverse.local
  adminPassword: admin123
  # Must be URL-safe (it is embedded in the Mongo connection string)
  mongoUsername: shopverse
  mongoPassword: change-me-mongo-password

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Defaults applied to every service unless overridden under services.<name>
serviceDefaults:
  replicaCount: 1
  port: 8080
  runAsUser: 1000
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  # Writable emptyDir mounts (root filesystem is read-only)
  writablePaths: [/tmp]
  env: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

services:
  frontend:
    enabled: true
    image: frontend
    tag: ""
    runAsUser: 101
    writablePaths: [/tmp, /etc/nginx/conf.d]
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { cpu: 200m, memory: 128Mi }
  api-gateway:
    enabled: true
    image: api-gateway
    tag: ""
    env:
      RATE_LIMIT_PER_MINUTE: "300"
      CORS_ORIGINS: ""
  user-service:
    enabled: true
    image: user-service
    tag: ""
    mongoDatabase: shopverse_users
    seedAdmin: true
  product-service:
    enabled: true
    image: product-service
    tag: ""
    mongoDatabase: shopverse_products
    env:
      SEED_DATA: "true"
  cart-service:
    enabled: true
    image: cart-service
    tag: ""
    mongoDatabase: shopverse_carts
  order-service:
    enabled: true
    image: order-service
    tag: ""
    mongoDatabase: shopverse_orders
    env:
      FREE_DELIVERY_ABOVE: "500"
      DELIVERY_FEE: "40"
  payment-service:
    enabled: true
    image: payment-service
    tag: ""
    mongoDatabase: shopverse_payments

mongodb:
  # Set enabled=false and fill `external.host` to use a managed MongoDB (Atlas, DocumentDB, ...)
  enabled: true
  image: mongo:7.0
  port: 27017
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  external:
    host: ""
    options: authSource=admin

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: shopverse.local
  tls:
    enabled: false
    secretName: shopverse-tls

# Restricts MongoDB to app pods and /internal service traffic to pods of this release.
networkPolicy:
  enabled: true
  # Namespace label of your ingress controller (used to allow traffic to frontend and gateway)
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx

# In-cluster DNS server the frontend nginx uses to resolve the gateway
clusterDNS: kube-dns.kube-system.svc.cluster.local
clusterDomain: cluster.local
