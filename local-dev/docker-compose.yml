# LOCAL DEVELOPMENT ONLY - deployments go through Helm + Argo CD (see README / gitops/).
# From the repo root:
#   docker compose -f local-dev/docker-compose.yml up --build           -> http://localhost:3000
#   PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040 \
#   docker compose -f local-dev/docker-compose.yml --profile observability up --build   -> Grafana :3001
# Observability image versions match what the platform charts deploy in the cluster.
x-service-env: &service-env
  PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-}
  JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-dev-internal-token}
  PRODUCT_SERVICE_URL: http://product-service:8080
  CART_SERVICE_URL: http://cart-service:8080
  PAYMENT_SERVICE_URL: http://payment-service:8080

x-service: &service
  restart: unless-stopped
  depends_on:
    mongodb:
      condition: service_healthy

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    <<: *service
    build: ../services/user-service
    image: shopverse/user-service:local
    environment:
      <<: *service-env
      MONGO_URI: mongodb://mongodb:27017/shopverse_users
      ADMIN_EMAIL: admin@shopverse.local
      ADMIN_PASSWORD: admin123

  product-service:
    <<: *service
    build: ../services/product-service
    image: shopverse/product-service:local
    environment:
      <<: *service-env
      MONGO_URI: mongodb://mongodb:27017/shopverse_products
      SEED_DATA: "true"

  cart-service:
    <<: *service
    build: ../services/cart-service
    image: shopverse/cart-service:local
    environment:
      <<: *service-env
      MONGO_URI: mongodb://mongodb:27017/shopverse_carts

  order-service:
    <<: *service
    build: ../services/order-service
    image: shopverse/order-service:local
    environment:
      <<: *service-env
      MONGO_URI: mongodb://mongodb:27017/shopverse_orders

  payment-service:
    <<: *service
    build: ../services/payment-service
    image: shopverse/payment-service:local
    environment:
      <<: *service-env
      MONGO_URI: mongodb://mongodb:27017/shopverse_payments

  api-gateway:
    build: ../services/api-gateway
    image: shopverse/api-gateway:local
    restart: unless-stopped
    environment:
      USER_SERVICE_URL: http://user-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8080
      CART_SERVICE_URL: http://cart-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      CORS_ORIGINS: http://localhost:5173
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-}
    ports:
      - "8080:8080"

  frontend:
    build: ../frontend
    image: shopverse/frontend:local
    restart: unless-stopped
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
    depends_on:
      - api-gateway
    ports:
      - "3000:8080"

  # ---------- observability profile ----------
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    command: [--config.file=/etc/prometheus/prometheus.yml, --web.enable-lifecycle]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.6.11
    profiles: [observability]
    command: [-config.file=/etc/loki/local-config.yaml]
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.20.0
    profiles: [observability]
    command: [run, /etc/alloy/config.alloy, --server.http.listen-addr=0.0.0.0:12345]
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  pyroscope:
    image: grafana/pyroscope:2.3.1
    profiles: [observability]
    ports:
      - "4040:4040"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../helm/shopverse/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on: [prometheus, loki, pyroscope]

volumes:
  mongo-data:
