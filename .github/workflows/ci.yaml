name: CI / CD

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "gitops/environments/**"
      - "gitops/platform/**"
      - "gitops/argocd/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Lint & build checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & syntax-check backend services
        run: |
          for svc in services/*/; do
            echo "::group::$svc"
            (cd "$svc" && npm ci --no-audit --no-fund && for f in src/*.js; do node --check "$f"; done)
            echo "::endgroup::"
          done

      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - uses: azure/setup-helm@v4

      - name: Helm lint & render every environment
        run: |
          helm lint helm/shopverse
          for env in gitops/environments/*/; do
            echo "Rendering $env"
            helm lint helm/shopverse -f "$env/values.yaml"
            helm template shopverse helm/shopverse -f "$env/values.yaml" > "rendered-$(basename "$env").yaml"
          done

      - name: Render Argo CD bootstrap (Kustomize)
        run: kubectl kustomize gitops/bootstrap > rendered-bootstrap.yaml

      - name: Validate manifests against Kubernetes + CRD schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-*.yaml gitops/argocd gitops/platform/manifests

      - name: Check Prometheus alert rules
        run: |
          yq 'select(.kind == "PrometheusRule") | .spec' rendered-dev.yaml > rules.yaml
          docker run --rm -v "$PWD:/w" --entrypoint promtool prom/prometheus:v3.4.0 check rules /w/rules.yaml

  build:
    name: Build ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: frontend, context: frontend }
          - { service: api-gateway, context: services/api-gateway }
          - { service: user-service, context: services/user-service }
          - { service: product-service, context: services/product-service }
          - { service: cart-service, context: services/cart-service }
          - { service: order-service, context: services/order-service }
          - { service: payment-service, context: services/payment-service }
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase: ghcr.io/<owner>/<repo>/<service>
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=shopverse-${{ matrix.service }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # GitOps step: write the new image tag into the dev environment; Argo CD syncs it.
  deploy-dev:
    name: Update dev image tag (GitOps)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump dev imageTag
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          yq -i ".global.imageTag = \"${TAG}\"" gitops/environments/dev/values.yaml
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/environments/dev/values.yaml
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "chore(gitops): deploy ${TAG} to dev [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
